[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geoesp-denue"
version = "0.1.0"
description = "Análisis geoespacial de la distribución de sucursales de AFOREs en México usando datos del DENUE (INEGI)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "geopandas>=0.14",
    "shapely>=2.0",
    "fiona>=1.9",
    "pyproj>=3.6",
    "rtree>=1.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "folium>=0.15",
    "plotly>=5.20",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "tenacity>=8.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.25",
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
